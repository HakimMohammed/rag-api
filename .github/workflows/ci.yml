name: RAG CI Pipeline

on:
  push:
    paths:
      - 'app/app.py'
      - 'app/embed_docs.py'
      - 'app/docs/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Embeddings
        run: python app/embed_docs.py # Changed from embed.py to embed_docs.py

      - name: Start API in mock mode
        run: |
          MOCK_MODE=1 uvicorn app.app:app --host 0.0.0.0 --port 8000 & sleep 5

      - name: Run Tests
        run: |
          MOCK_MODE=1 pytest
      
      - name: Success Message
        run: echo "All tests passed and embeddings built successfully!"